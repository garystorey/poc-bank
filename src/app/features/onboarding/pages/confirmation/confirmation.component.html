<app-stepper [currentStep]="4" />
<div class="confirmation-page">
  <div class="confirmation-card">
    <div class="confirmation-icon" aria-hidden="true">
      <i class="fas fa-check"></i>
    </div>

    <h1 class="confirmation-title">Account Created</h1>
    <p class="confirmation-message">
      Your new POC Bank checking account is ready. You can head back home or sign in to explore your new account dashboard.
    </p>

    <div class="confirmation-actions">
      <a routerLink="/" class="confirmation-link">
        <app-button variant="standard">Return Home</app-button>
      </a>
      <a routerLink="/login" class="confirmation-link">
        <app-button variant="primary">Go to Login</app-button>
      </a>
    </div>
  </div>
</div>
