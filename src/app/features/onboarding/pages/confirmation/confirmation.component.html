<!-- Success page – “Account created” -->
<div class="confirmation-page">
  <div class="confirmation-content">
    <!-- Header / Logo -->
    <h1 class="confirmation-title">🎉 Account Created!</h1>

    <!-- Message -->
    <p class="confirmation-message">
      Your new checking account at POC Bank is ready to use. Let’s get started.
    </p>

    <!-- Action buttons -->
    <div class="confirmation-actions">
      <a routerLink="/">
        <app-button variant="standard">Return to Home</app-button>
      </a>
      <a routerLink="/login">
        <app-button variant="primary">Go to Login</app-button>
      </a>
    </div>
  </div>
</div>
