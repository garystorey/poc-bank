<app-stepper [currentStep]="1"/>
<form class="form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate aria-describedby="required-text">
  <div class="form-section">
    <div>
      <h2 class="form-section-title">Personal Information</h2>
      <p class="required-text">* Required fields</p>
    </div>

    <app-error-summary [control]="form" [show]="showSummary()" [messages]="errorMessages" [focusOnShow]="true" class="error-summary"/>

    <div class="form-row">
      <app-input label="First Name"
        formControlName="firstName" inputId="firstName" name="firstName" type="text"
        [inputAttrs]="{ autocomplete: 'given-name' }" [required]="true"
        [submitted]="submitted()"
        helpText="Enter your First Name"
        errorText="First Name is required."
      />
      <app-input label="Last Name"
        formControlName="lastName" inputId="lastName" name="lastName" type="text"
        [inputAttrs]="{ autocomplete: 'family-name' }" [required]="true"
        [submitted]="submitted()"
        helpText="Enter your Last Name"
        errorText="Last Name is required."
      />

    </div>

    <div class="form-row">

      <app-input label="Date of Birth"
        formControlName="dateOfBirth" inputId="dateOfBirth" name="dateOfBirth" type="date"
        [required]="true"
        [submitted]="submitted()"
        helpText="Enter your Date of Birth"
        errorText="Date of Birth is required and must be at least 18 years old"
      />
      <app-input label="Social Security Number"
        formControlName="socialSecurityNumber" inputId="ssn" name="ssn" type="text"
        [inputAttrs]="{ inputmode: 'numeric', maxlength: 11 }" [required]="true"
        [keyDownHandler]="handleSsnKeydown"
        [submitted]="submitted()"
        helpText="Enter your SSN in the format XXX-XX-XXXX"
        errorText="SSN is required"
      />
    </div>
  </div>

  <div class="form-section">
    <h2 class="form-section-title">Address Information</h2>

    <div class="form-row">
      <app-input label="Street Address"
        formControlName="streetAddress" inputId="streetAddress" name="streetAddress" type="text"
        [inputAttrs]="{ autocomplete: 'street-address' }" [required]="true"
        [submitted]="submitted()"
        class="full-width"
        helpText="Enter your Street Address"
        errorText="Street Address is required."
      />
    </div>

    <div class="form-row">

      <app-input label="City"
        formControlName="city" inputId="city" name="city" type="text"
        [inputAttrs]="{ autocomplete: 'address-level2' }" [required]="true"
        [submitted]="submitted()"
        helpText="Enter your City"
        errorText="City is required."
      />

      <app-select label="State" [required]="true" selectId="state" name="state"
        formControlName="state"
        [options]="states"
        helpText="Select your State."
        errorText="State is required."
      />

    </div>

    <div class="form-row">

      <app-input label="ZIP Code"
        formControlName="zipCode" inputId="zipCode" name="zipCode" type="text"
        [inputAttrs]="{ inputmode: 'numeric', autocomplete: 'postal-code' }" [required]="true"
        [submitted]="submitted()"
        helpText="Enter your ZIP Code"
        errorText="ZIP Code is required."
      />
      <div class="form-group">
      </div>
    </div>
  </div>

  <div class="form-actions">
    <div style="width:55%">&nbsp;</div>
    <app-button variant="primary" size="fixed" type="submit">
      Next
    </app-button>
  </div>

</form>
