            <form id="fundingInfoForm">
                <div class="form-section">
                    <h2 class="form-section-title">Initial Deposit Information</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="initialAmount" class="required">Initial Deposit Amount</label>
                            <input type="number" id="initialAmount" name="initialAmount" min="0" step="0.01" required>
                        </div>
                        <div class="form-group">
                            <label for="depositMethod" class="required">Deposit Method</label>
                            <select id="depositMethod" name="depositMethod" required>
                                <option value="">Select Method</option>
                                <option value="check">Check</option>
                                <option value="wire">Wire Transfer</option>
                                <option value="ach">ACH Transfer</option>
                                <option value="cash">Cash</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title">Source of Funds</h2>

                    <div class="account-type">
                        <div class="account-type-option selected">
                            <h3>Personal Savings</h3>
                            <p>From your personal savings account</p>
                        </div>
                        <div class="account-type-option">
                            <h3>Employment Income</h3>
                            <p>From salary or wages</p>
                        </div>
                        <div class="account-type-option">
                            <h3>Investment Returns</h3>
                            <p>From investments or dividends</p>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group full-width">
                            <label for="fundingSource" class="required">Funding Source</label>
                            <select id="fundingSource" name="fundingSource" required>
                                <option value="">Select Source</option>
                                <option value="personal">Personal Savings</option>
                                <option value="gift">Gift from Family</option>
                                <option value="sale">Sale of Property</option>
                                <option value="inheritance">Inheritance</option>
                                <option value="employment">Employment Income</option>
                                <option value="investment">Investment Returns</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h2 class="form-section-title">External Account Information</h2>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="routingNumber" class="required">Routing Number</label>
                            <input type="text" id="routingNumber" name="routingNumber" placeholder="000000000" required>
                        </div>
                        <div class="form-group">
                            <label for="accountNumber" class="required">Account Number</label>
                            <input type="text" id="accountNumber" name="accountNumber" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="accountType" class="required">Account Type</label>
                            <select id="accountType" name="accountType" required>
                                <option value="">Select Type</option>
                                <option value="checking">Checking</option>
                                <option value="savings">Savings</option>
                                <option value="moneyMarket">Money Market</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="bankName" class="required">Bank Name</label>
                            <input type="text" id="bankName" name="bankName" required>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-prev">Previous</button>
                    <button type="submit" class="btn btn-next">Next Step</button>
                </div>

                <p class="required-text">* Required fields</p>
            </form>
