<form id="fundingInfoForm">
  <div class="form-section">
    <h2 class="form-section-title">Initial Deposit Information</h2>
    <p class="required-text">* Required fields</p>
  </div>
  <div class="form-section">
    <div class="form-row">
      <div class="form-group">
        <label for="initialAmount" class="required">Initial Deposit Amount</label>
        <input type="number" id="initialAmount" name="initialAmount" min="0" step="0.01" required>
      </div>
      <div class="form-group">
        <label for="depositMethod" class="required">Deposit Method</label>
        <select id="depositMethod" name="depositMethod" required>\
          @for (method of this.depositMethods; track method.value) {
            <option [value]="method.value">{{method.label}}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group full-width">
        <label for="fundingSource" class="required">Funding Source</label>
        <select id="fundingSource" name="fundingSource" required>
          @for (source of this.fundingSources; track source.value) {
            <option [value]="source.value">{{source.label}}</option>
          }
        </select>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="routingNumber" class="required">Routing Number</label>
        <input type="text" id="routingNumber" name="routingNumber" required>
      </div>
      <div class="form-group">
        <label for="accountNumber" class="required">Account Number</label>
        <input type="text" id="accountNumber" name="accountNumber" required>
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="accountType" class="required">Account Type</label>
        <select id="accountType" name="accountType" required>
          @for (atype of this.accountTypes; track atype.value) {
            <option [value]="atype.value">{{atype.label}}</option>
          }
        </select>
      </div>

      <div class="form-group">
        <label for="bankName" class="required">Bank Name</label>
        <input type="text" id="bankName" name="bankName" required>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn">Previous</button>
    <button type="submit" class="btn btn-primary">Next Step</button>
  </div>

</form>
