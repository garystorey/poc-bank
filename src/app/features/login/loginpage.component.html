<div class="login-container">
  <form class="login-form" id="loginForm" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="form-group">
      <label for="username">Username or Email</label>
      <div class="input-wrapper">
        <input type="text" id="username" class="form-control" formControlName="username" required>
        <span class="input-icon">
          <i class="fas fa-user"></i>
        </span>
      </div>
      @if (form.controls.username.invalid && (form.controls.username.touched || submitted())) {
        <p class="error">Username or email is required.</p>
      }
    </div>

    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrapper">
        <input type="password" id="password" class="form-control" formControlName="password" required>
        <span class="input-icon password-toggle" aria-hidden="true">
          <i class="fas fa-lock"></i>
        </span>
      </div>
      @if (form.controls.password.invalid && (form.controls.password.touched || submitted())) {
        <p class="error">Password is required.</p>
      }
    </div>

    <button type="submit" class="btn btn-primary">Sign In</button>

    <div class="form-footer">
      <p><a href="#">Forgot your password?</a></p>
      <p>Don't have an account? <a href="#">Sign up now</a></p>
    </div>
  </form>
</div>
