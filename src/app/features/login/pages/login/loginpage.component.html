    <div class="login-container">
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <div class="input-wrapper">
                    <input type="text" id="username" class="form-control" required>
                    <span class="input-icon">
                        <i class="fas fa-user"></i>
                    </span>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input type="password" id="password" class="form-control" required>
                    <span class="input-icon password-toggle" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>

                <div class="requirements">
                    <h4>Password Requirements:</h4>
                    <ul class="requirement-list">
                        <li class="requirement-item">
                            <span class="requirement-icon invalid" id="uppercase-icon">
                                <i class="fas fa-times-circle"></i>
                            </span>
                            <span id="uppercase-text">At least one uppercase letter</span>
                        </li>
                        <li class="requirement-item">
                            <span class="requirement-icon invalid" id="lowercase-icon">
                                <i class="fas fa-times-circle"></i>
                            </span>
                            <span id="lowercase-text">At least one lowercase letter</span>
                        </li>
                        <li class="requirement-item">
                            <span class="requirement-icon invalid" id="special-icon">
                                <i class="fas fa-times-circle"></i>
                            </span>
                            <span id="special-text">At least one special character</span>
                        </li>
                    </ul>
                </div>
            </div>

            <button type="submit" class="btn btn-primary">Sign In</button>

            <div class="form-footer">
                <p><a href="#">Forgot your password?</a></p>
                <p>Don't have an account? <a href="#">Sign up now</a></p>
            </div>

            <div class="divider">
                <span>or continue with</span>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn">
                    <i class="fab fa-google"></i>
                    Google
                </button>
                <button type="button" class="social-btn">
                    <i class="fab fa-apple"></i>
                    Apple
                </button>
            </div>
        </form>
    </div>
