<header [class.menu-open]="mobileMenuOpen()">
  <div class="container">
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <a routerLink="/" class="logo-container" (click)="closeMobileMenu()">
        <span class="logo-icon">
          <i class="fas fa-piggy-bank" aria-hidden="true"></i>
        </span>
        <span class="logo-text">POC Bank</span>
      </a>
    @if(!isOnboardingPage()) {
      <button
        class="mobile-toggle"
        (click)="toggleMobileMenu()"
        [attr.aria-expanded]="mobileMenuOpen()"
        aria-controls="nav-menu"
        aria-label="Toggle navigation menu">
        <span class="hamburger" [class.active]="mobileMenuOpen()">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
      <!-- Navigation Links -->
      <div class="nav-wrapper" [class.open]="mobileMenuOpen()" id="nav-menu">
        <ul class="nav-links">
          <li>
            <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="closeMobileMenu()">
              <i class="fas fa-home" aria-hidden="true"></i>
              <span>Personal</span>
            </a>
          </li>
          <li>
            <a routerLink="/" (click)="handleProtectedNavigation($event)">
              <i class="fas fa-building" aria-hidden="true"></i>
              <span>Business</span>
            </a>
          </li>
          <li>
            <a routerLink="/" (click)="handleProtectedNavigation($event)">
              <i class="fas fa-info-circle" aria-hidden="true"></i>
              <span>About</span>
            </a>
          </li>
          <li>
            <a routerLink="/" (click)="handleProtectedNavigation($event)">
              <i class="fas fa-envelope" aria-hidden="true"></i>
              <span>Contact</span>
            </a>
          </li>
        </ul>
        <div class="nav-actions">
          <!-- Theme Toggle -->
          <button
            class="theme-toggle"
            (click)="toggleTheme()"
            [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
            type="button">
            <i class="fas" [ngClass]="isDarkMode() ? 'fa-sun' : 'fa-moon'" aria-hidden="true"></i>
          </button>

          <!-- Auth Button -->
          @if (isAuthenticated()) {
            <button class="btn btn-primary" type="button" (click)="handleAuthAction()">
              <i class="fas fa-sign-out-alt" aria-hidden="true"></i>
              <span>Logout</span>
            </button>
          } @else {
            <a routerLink="/login" class="btn btn-primary" (click)="handleAuthAction()">
              <i class="fas fa-sign-in-alt" aria-hidden="true"></i>
              <span>Login</span>
            </a>
          }
        </div>
      </div>
    }
    </nav>
  </div>

  <!-- Mobile Overlay -->
  @if (mobileMenuOpen()) {
    <div class="mobile-overlay" (click)="closeMobileMenu()" aria-hidden="true"></div>
  }
</header>
